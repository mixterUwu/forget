<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TARKOV 2D • Misma Velocidad</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    body {
      background: #0a0c0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 8px;
    }
    #game-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16;
      background: #1a1e1a;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 35px rgba(0,0,0,0.8);
      border: 1px solid #3a4a3a;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .health-box {
      background: rgba(0,0,0,0.7);
      border: 1px solid #4caf50;
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }
    .hp-bar-bg {
      width: 80px;
      height: 10px;
      background: #2d2d2d;
      border-radius: 10px;
      overflow: hidden;
    }
    .hp-fill {
      height: 100%;
      width: 100%;
      background: #4caf50;
      border-radius: 10px;
    }
    .extract-timer {
      background: #000000cc;
      border: 1px solid #ffaa00;
      color: #ffaa00;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      backdrop-filter: blur(4px);
    }
    .ammo-indicator {
      position: absolute;
      bottom: 130px;
      right: 16px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #ffcc00;
      color: #ffcc00;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      z-index: 10;
    }
    .cooldown-indicator {
      position: absolute;
      bottom: 100px;
      right: 16px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #e74c3c;
      color: #e74c3c;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      z-index: 10;
      display: none;
    }
    .controls {
      position: absolute;
      bottom: 18px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
      pointer-events: none;
    }
    .joystick-area {
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      position: relative;
      pointer-events: auto;
      touch-action: none;
    }
    .joystick-thumb {
      width: 44px;
      height: 44px;
      background: rgba(220,220,220,0.7);
      border-radius: 50%;
      position: absolute;
      top: 28px;
      left: 28px;
      border: 2px solid white;
      transition: background 0.1s;
    }
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      pointer-events: auto;
    }
    .fire-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #c0392b;
      border: 2px solid #e74c3c;
      color: white;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px #e74c3c80;
      transition: 0.08s;
      touch-action: manipulation;
      position: relative;
    }
    .fire-btn.cooldown {
      background: #7f8c8d;
      border-color: #95a5a6;
      box-shadow: 0 0 5px #7f8c8d80;
    }
    .fire-btn:active:not(.cooldown) {
      transform: scale(0.88);
      background: #e74c3c;
    }
    .loot-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #d4a017;
      border: 2px solid #f1c40f;
      color: black;
      font-weight: bold;
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px #f1c40faa;
      touch-action: manipulation;
    }
    .extract-msg {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffaa00dd;
      color: black;
      padding: 6px 20px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      z-index: 15;
      display: none;
    }
    .minimap-container {
      position: absolute;
      top: 60px;
      right: 10px;
      width: 100px;
      height: 100px;
      background: rgba(0,0,0,0.8);
      border: 2px solid #5a6b5a;
      border-radius: 12px;
      z-index: 12;
      backdrop-filter: blur(3px);
      overflow: hidden;
    }
    .minimap-label {
      position: absolute;
      top: 55px;
      right: 14px;
      color: #aaa;
      font-size: 8px;
      z-index: 13;
      pointer-events: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="400" height="710"></canvas>

  <div class="hud">
    <div class="health-box">
      <span style="color:#4caf50;">❤️</span>
      <div class="hp-bar-bg"><div id="hpFill" class="hp-fill" style="width:100%"></div></div>
    </div>
    <div class="extract-timer" id="extractDisplay">🚁 0%</div>
  </div>

  <div class="minimap-container">
    <canvas id="minimapCanvas" width="100" height="100"></canvas>
  </div>
  <div class="minimap-label">MAPA</div>

  <div class="ammo-indicator">
    🔫 <span id="ammoCount">50</span>
  </div>

  <div class="cooldown-indicator" id="cooldownDisplay">⏳ RECARGANDO</div>

  <div class="extract-msg" id="extractMessage">⏳ EXTRAYENDO...</div>

  <div class="controls">
    <div class="joystick-area" id="joystickBase">
      <div class="joystick-thumb" id="joystickThumb"></div>
    </div>
    <div class="action-buttons">
      <div class="loot-btn" id="lootButton">📦 LOOT</div>
      <div class="fire-btn" id="fireButton">🔫</div>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimapCanvas');
    const minimapCtx = minimapCanvas.getContext('2d');

    const W = 400, H = 710;
    canvas.width = W;
    canvas.height = H;

    const SHOOT_COOLDOWN = 400;
    const BASE_SPEED = 4.5; // Misma velocidad para jugador y enemigos

    const state = {
      hp: 200,
      maxHp: 200,
      ammo: 60,
      mapW: 1600,
      mapH: 1600,
      zoom: 2.0,
      extractProgress: 0,
      extracting: false,
      gameOver: false,
      victory: false,
      enemySpawnTimer: 0,
      spawnInterval: 200,
      lastShootTime: 0,
      cooldownActive: false
    };

    const player = {
      x: 800, y: 800,
      radius: 12,
      angle: 0,
      speed: BASE_SPEED,
      vx: 0, vy: 0
    };

    const camera = { x: 0, y: 0 };

    const vegetation = [];
    function generateVegetation() {
      for (let i = 0; i < 150; i++) {
        vegetation.push({
          x: Math.random() * state.mapW,
          y: Math.random() * state.mapH,
          type: Math.random() < 0.6 ? 'tree' : 'bush',
          radius: Math.random() < 0.6 ? 14 + Math.random() * 10 : 8 + Math.random() * 8
        });
      }
    }
    generateVegetation();

    let enemies = [];
    function spawnInitialEnemies() {
      for (let i = 0; i < 12; i++) {
        let ex, ey;
        do {
          ex = 200 + Math.random() * (state.mapW - 400);
          ey = 200 + Math.random() * (state.mapH - 400);
        } while (Math.hypot(ex - player.x, ey - player.y) < 400);
        enemies.push({
          x: ex, y: ey,
          hp: 60 + Math.floor(Math.random() * 40),
          maxHp: 60,
          speed: BASE_SPEED - 2.5,
          radius: 13
        });
      }
    }
    spawnInitialEnemies();

    let bullets = [];
    let lootDrops = [];
    let floatingTexts = [];

    const extractionZone = {
      x: 1200,
      y: 1200,
      radius: 70
    };

    const joystickBase = document.getElementById('joystickBase');
    const joystickThumb = document.getElementById('joystickThumb');
    let joystickActive = false;
    let joystickCenter = { x: 0, y: 0 };

    const fireBtn = document.getElementById('fireButton');
    const cooldownDisplay = document.getElementById('cooldownDisplay');
    let firing = false;
    let cooldownTimer = null;

    const lootBtn = document.getElementById('lootButton');
    let activeLootIndex = -1;

    function isOnScreen(x, y, margin = 70) {
      const screenLeft = camera.x - margin;
      const screenTop = camera.y - margin;
      const screenRight = camera.x + (W / state.zoom) + margin;
      const screenBottom = camera.y + (H / state.zoom) + margin;
      return x > screenLeft && x < screenRight && y > screenTop && y < screenBottom;
    }

    function spawnEnemyNearPlayer() {
      for (let attempt = 0; attempt < 50; attempt++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 400 + Math.random() * 300;
        const ex = player.x + Math.cos(angle) * dist;
        const ey = player.y + Math.sin(angle) * dist;
        
        if (!isOnScreen(ex, ey, 50) && 
            ex > 40 && ex < state.mapW - 40 && 
            ey > 40 && ey < state.mapH - 40) {
          enemies.push({
            x: ex, y: ey,
            hp: 55 + Math.floor(Math.random() * 35),
            maxHp: 55,
            speed: BASE_SPEED,
            radius: 13
          });
          return true;
        }
      }
      const edgeAngle = Math.random() * Math.PI * 2;
      const ex = player.x + Math.cos(edgeAngle) * 500;
      const ey = player.y + Math.sin(edgeAngle) * 500;
      if (ex > 40 && ex < state.mapW - 40 && ey > 40 && ey < state.mapH - 40) {
        enemies.push({
          x: ex, y: ey,
          hp: 55 + Math.floor(Math.random() * 35),
          maxHp: 55,
          speed: BASE_SPEED,
          radius: 13
        });
        return true;
      }
      return false;
    }

    function updateEnemySpawning() {
      if (state.gameOver) return;
      
      state.enemySpawnTimer++;
      const currentInterval = state.extracting ? 130 : state.spawnInterval;
      const enemiesToSpawn = 6 + Math.floor(Math.random() * 2);
      
      if (state.enemySpawnTimer >= currentInterval && enemies.length < 25) {
        state.enemySpawnTimer = 0;
        let spawned = 0;
        for (let i = 0; i < enemiesToSpawn; i++) {
          if (spawnEnemyNearPlayer()) spawned++;
        }
        if (spawned === 0) state.enemySpawnTimer = currentInterval - 25;
      }
    }

    function startCooldown() {
      state.cooldownActive = true;
      state.lastShootTime = Date.now();
      fireBtn.classList.add('cooldown');
      cooldownDisplay.style.display = 'block';
      
      if (cooldownTimer) clearTimeout(cooldownTimer);
      cooldownTimer = setTimeout(() => {
        state.cooldownActive = false;
        fireBtn.classList.remove('cooldown');
        cooldownDisplay.style.display = 'none';
        cooldownTimer = null;
      }, SHOOT_COOLDOWN);
    }

    function canShoot() {
      return !state.cooldownActive && (Date.now() - state.lastShootTime >= SHOOT_COOLDOWN);
    }

    function setupJoystick() {
      const start = (e) => {
        e.preventDefault();
        if (state.gameOver) return;
        joystickActive = true;
        const rect = joystickBase.getBoundingClientRect();
        joystickCenter = {
          x: rect.left + rect.width/2,
          y: rect.top + rect.height/2
        };
        move(e);
      };

      const move = (e) => {
        if (!joystickActive) return;
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - joystickCenter.x;
        const dy = touch.clientY - joystickCenter.y;
        const dist = Math.min(35, Math.hypot(dx, dy));
        const angle = Math.atan2(dy, dx);
        const moveX = Math.cos(angle) * dist;
        const moveY = Math.sin(angle) * dist;

        joystickThumb.style.transform = `translate(${moveX}px, ${moveY}px)`;
        player.vx = Math.cos(angle) * (dist / 35);
        player.vy = Math.sin(angle) * (dist / 35);
      };

      const end = () => {
        joystickActive = false;
        joystickThumb.style.transform = 'translate(0px, 0px)';
        player.vx = 0;
        player.vy = 0;
      };

      joystickBase.addEventListener('touchstart', start, {passive: false});
      joystickBase.addEventListener('touchmove', move, {passive: false});
      joystickBase.addEventListener('touchend', end);
      joystickBase.addEventListener('touchcancel', end);
      joystickBase.addEventListener('mousedown', start);
      window.addEventListener('mousemove', (e) => {
        if (joystickActive) move(e);
      });
      window.addEventListener('mouseup', end);
    }

    fireBtn.addEventListener('touchstart', (e) => { 
      e.preventDefault(); 
      firing = true; 
      if (canShoot()) shoot();
    });
    fireBtn.addEventListener('touchend', () => firing = false);
    fireBtn.addEventListener('mousedown', (e) => { 
      e.preventDefault(); 
      firing = true; 
      if (canShoot()) shoot();
    });
    fireBtn.addEventListener('mouseup', () => firing = false);

    function getClosestEnemy() {
      let closest = null;
      let minDist = 400;
      enemies.forEach(enemy => {
        const d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        if (d < minDist) {
          minDist = d;
          closest = enemy;
        }
      });
      return closest;
    }

    function shoot() {
      if (state.ammo <= 0 || state.gameOver || !canShoot()) return;
      
      const target = getClosestEnemy();
      if (target) {
        player.angle = Math.atan2(target.y - player.y, target.x - player.x);
      }
      
      state.ammo--;
      updateAmmoDisplay();
      startCooldown();

      bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        vx: Math.cos(player.angle) * 11,
        vy: Math.sin(player.angle) * 11,
        isPlayer: true
      });

      floatingTexts.push({
        x: player.x + Math.cos(player.angle) * 24,
        y: player.y + Math.sin(player.angle) * 24,
        text: '💥',
        color: '#ffaa00',
        size: 15,
        life: 12
      });
    }

    lootBtn.addEventListener('click', () => collectLoot());
    lootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); collectLoot(); });

    function collectLoot() {
      if (activeLootIndex === -1 || state.gameOver) return;
      const loot = lootDrops[activeLootIndex];
      state.ammo += loot.amount;
      updateAmmoDisplay();

      floatingTexts.push({
        x: player.x, y: player.y - 14,
        text: `+${loot.amount} AMMO`,
        color: '#f1c40f',
        size: 15,
        life: 25
      });

      lootDrops.splice(activeLootIndex, 1);
      activeLootIndex = -1;
      lootBtn.style.display = 'none';
    }

    function updateAmmoDisplay() {
      document.getElementById('ammoCount').textContent = state.ammo;
    }

    function updateExtraction() {
      const distToZone = Math.hypot(player.x - extractionZone.x, player.y - extractionZone.y);
      const insideZone = distToZone < extractionZone.radius;

      if (insideZone && !state.gameOver && state.hp > 0) {
        state.extracting = true;
        state.extractProgress += 0.3;
        if (state.extractProgress >= 100) {
          state.extractProgress = 100;
          state.victory = true;
          state.gameOver = true;
        }
      } else {
        state.extracting = false;
        state.extractProgress = Math.max(0, state.extractProgress - 0.5);
      }

      document.getElementById('extractDisplay').textContent = 
        `🚁 ${Math.floor(state.extractProgress)}%`;
      document.getElementById('extractMessage').style.display = 
        (state.extracting && !state.gameOver) ? 'block' : 'none';
    }

    function drawMinimap() {
      minimapCtx.clearRect(0, 0, 100, 100);
      minimapCtx.fillStyle = '#0d110d';
      minimapCtx.fillRect(0, 0, 100, 100);
      
      const scaleX = 100 / state.mapW;
      const scaleY = 100 / state.mapH;
      
      vegetation.forEach(v => {
        minimapCtx.fillStyle = v.type === 'tree' ? '#1a5c1a' : '#2d7a2d';
        minimapCtx.fillRect(v.x * scaleX - 0.8, v.y * scaleY - 0.8, 1.6, 1.6);
      });
      
      minimapCtx.fillStyle = '#ffaa00';
      minimapCtx.beginPath();
      minimapCtx.arc(extractionZone.x * scaleX, extractionZone.y * scaleY, 5, 0, 2*Math.PI);
      minimapCtx.fill();
      minimapCtx.strokeStyle = '#ffffff';
      minimapCtx.lineWidth = 1.5;
      minimapCtx.stroke();
      
      minimapCtx.fillStyle = '#f1c40f';
      lootDrops.forEach(l => {
        minimapCtx.fillRect(l.x * scaleX - 1.2, l.y * scaleY - 1.2, 2.4, 2.4);
      });
      
      minimapCtx.fillStyle = '#e74c3c';
      enemies.forEach(e => {
        minimapCtx.beginPath();
        minimapCtx.arc(e.x * scaleX, e.y * scaleY, 2.5, 0, 2*Math.PI);
        minimapCtx.fill();
      });
      
      minimapCtx.fillStyle = '#4caf50';
      minimapCtx.beginPath();
      minimapCtx.arc(player.x * scaleX, player.y * scaleY, 4, 0, 2*Math.PI);
      minimapCtx.fill();
      minimapCtx.strokeStyle = '#ffffff';
      minimapCtx.lineWidth = 2;
      minimapCtx.stroke();
      
      minimapCtx.strokeStyle = '#5a6b5a';
      minimapCtx.lineWidth = 2;
      minimapCtx.strokeRect(0, 0, 100, 100);
    }

    function update() {
      if (state.gameOver || state.hp <= 0) {
        if (state.hp <= 0) state.gameOver = true;
        return;
      }

      player.x += player.vx * player.speed;
      player.y += player.vy * player.speed;
      player.x = Math.max(18, Math.min(state.mapW - 18, player.x));
      player.y = Math.max(18, Math.min(state.mapH - 18, player.y));

      const target = getClosestEnemy();
      if (target) {
        player.angle = Math.atan2(target.y - player.y, target.x - player.x);
      } else if (player.vx !== 0 || player.vy !== 0) {
        player.angle = Math.atan2(player.vy, player.vx);
      }

      if (firing && canShoot() && state.ammo > 0) {
        shoot();
      }

      camera.x = player.x - (W / (2 * state.zoom));
      camera.y = player.y - (H / (2 * state.zoom));

      updateEnemySpawning();

      for (let i = bullets.length-1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < 0 || b.x > state.mapW || b.y < 0 || b.y > state.mapH) {
          bullets.splice(i,1);
          continue;
        }

        if (b.isPlayer) {
          for (let j = enemies.length-1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 4) {
              e.hp -= 35;
              floatingTexts.push({ x: e.x, y: e.y-10, text: '-35', color: '#ff5555', size:14, life:16 });
              bullets.splice(i,1);
              if (e.hp <= 0) {
                lootDrops.push({
                  x: e.x, y: e.y,
                  amount: 10 + Math.floor(Math.random() * 20)
                });
                enemies.splice(j,1);
              }
              break;
            }
          }
        }
      }

      enemies.forEach(e => {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 5) {
          e.x += (dx/dist) * e.speed;
          e.y += (dy/dist) * e.speed;
        }
        if (dist < 28 && state.hp > 0) {
          state.hp -= 0.7;
          if (state.hp <= 0) state.hp = 0;
        }
      });

      activeLootIndex = -1;
      for (let i = 0; i < lootDrops.length; i++) {
        if (Math.hypot(player.x - lootDrops[i].x, player.y - lootDrops[i].y) < 45) {
          activeLootIndex = i;
          break;
        }
      }
      lootBtn.style.display = (activeLootIndex !== -1 && !state.gameOver) ? 'flex' : 'none';

      updateExtraction();
      document.getElementById('hpFill').style.width = `${(state.hp/state.maxHp)*100}%`;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      ctx.scale(state.zoom, state.zoom);
      ctx.translate(-camera.x, -camera.y);

      ctx.fillStyle = '#1a2318';
      ctx.fillRect(0, 0, state.mapW, state.mapH);
      
      ctx.strokeStyle = '#28331f';
      ctx.lineWidth = 0.8;
      for (let i = 0; i < state.mapW; i += 50) {
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,state.mapH); ctx.stroke();
      }
      for (let j = 0; j < state.mapH; j += 50) {
        ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(state.mapW,j); ctx.stroke();
      }

      vegetation.forEach(v => {
        if (v.type === 'tree') {
          ctx.fillStyle = '#2d5a1e';
          ctx.beginPath();
          ctx.arc(v.x, v.y, v.radius, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#1f4015';
          ctx.beginPath();
          ctx.arc(v.x, v.y, v.radius * 0.7, 0, Math.PI*2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#3a6b2a';
          ctx.beginPath();
          ctx.arc(v.x, v.y, v.radius, 0, Math.PI*2);
          ctx.fill();
        }
      });

      ctx.beginPath();
      ctx.arc(extractionZone.x, extractionZone.y, extractionZone.radius, 0, Math.PI*2);
      ctx.fillStyle = state.extracting ? '#ffaa0040' : '#ffaa0015';
      ctx.fill();
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffaa00';
      ctx.font = 'bold 14px Arial';
      ctx.fillText('🚁 EXTRACCIÓN', extractionZone.x-62, extractionZone.y-32);

      lootDrops.forEach(l => {
        ctx.fillStyle = '#d4a017';
        ctx.fillRect(l.x-9, l.y-9, 18, 18);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 9px Arial';
        ctx.fillText('📦', l.x-8, l.y+4);
      });

      enemies.forEach(e => {
        const isTarget = (getClosestEnemy() === e);
        if (isTarget) {
          ctx.beginPath();
          ctx.arc(e.x, e.y, 19, 0, 2*Math.PI);
          ctx.strokeStyle = '#ff4d4d';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.fillStyle = '#4a3b32';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, 2*Math.PI); ctx.fill();
        ctx.fillStyle = '#c0392b';
        ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, 2*Math.PI); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.fillRect(e.x-13, e.y-19, 26, 5);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(e.x-13, e.y-19, 26*(e.hp/e.maxHp), 5);
      });

      bullets.forEach(b => {
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 2*Math.PI); ctx.fill();
      });

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      
      ctx.fillStyle = '#2c3e50';
      ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, 2*Math.PI); ctx.fill();
      ctx.fillStyle = '#5d6d7e';
      ctx.fillRect(6, -2, 22, 5);
      ctx.fillStyle = '#4caf50';
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, 2*Math.PI); ctx.fill();
      ctx.restore();

      floatingTexts.forEach((ft, i) => {
        ctx.fillStyle = ft.color;
        ctx.font = `bold ${ft.size}px Arial`;
        ctx.fillText(ft.text, ft.x, ft.y);
        ft.y -= 0.7;
        ft.life--;
      });
      floatingTexts = floatingTexts.filter(ft => ft.life > 0);

      ctx.restore();

      if (state.gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle = state.victory ? '#ffd700' : '#e74c3c';
        ctx.font = 'bold 34px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state.victory ? '¡EXTRAÍDO!' : 'ELIMINADO', W/2, H/2-20);
        ctx.font = '16px Arial';
        ctx.fillText(state.victory ? 'Helicóptero asegurado' : 'Intenta de nuevo', W/2, H/2+30);
      }
    }

    function gameLoop() {
      update();
      draw();
      drawMinimap();
      requestAnimationFrame(gameLoop);
    }

    setupJoystick();
    gameLoop();
  })();
</script>
</body>
</html>
